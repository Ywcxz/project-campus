# Renders every chapter of the master document in jsdom on each pull
# request and on every push to main. The job is named "Render test" so it
# can be required in a ruleset on main.
name: Render test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    name: Render test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the renderer's syntax
        run: node --check js/main.js

      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Render every chapter
        working-directory: tests
        run: npm test
